name: Metrics Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: metrics-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Verify metrics runtime inputs
        run: |
          test -n "${GH_TOKEN:-}"
          node --version
          npm --version
        env:
          GH_TOKEN: ${{ secrets.METRICS_GITHUB_TOKEN || github.token }}
      - name: Capture platform metrics
        run: >
          node scripts/metrics-snapshot.mjs
          --repo zr9959/ai-saas-guard
          --package ai-saas-guard
          --output .local/metrics/latest.json
          --jsonl .local/metrics/snapshots.jsonl
          --summary-markdown .local/metrics/summary.md
        env:
          GH_TOKEN: ${{ secrets.METRICS_GITHUB_TOKEN || github.token }}
      - name: Publish metrics summary
        run: cat .local/metrics/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-saas-guard-metrics-snapshot
          path: |
            .local/metrics/latest.json
            .local/metrics/snapshots.jsonl
            .local/metrics/summary.md
          if-no-files-found: error
          retention-days: 30
