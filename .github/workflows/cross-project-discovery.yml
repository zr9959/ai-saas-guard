name: Cross-Project Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cross-project-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Run public discovery check
        run: >
          node scripts/cross-project-discovery-check.mjs
          --output .local/cross-project-discovery/latest.json
          --summary-markdown .local/cross-project-discovery/summary.md
      - name: Publish discovery summary
        run: cat .local/cross-project-discovery/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cross-project-discovery
          path: |
            .local/cross-project-discovery/latest.json
            .local/cross-project-discovery/summary.md
          if-no-files-found: error
          retention-days: 30
