name: Cross-Project Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cross-project-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Run public discovery check
        run: >
          node scripts/cross-project-discovery-check.mjs
          --output .local/cross-project-discovery/latest.json
          --summary-markdown .local/cross-project-discovery/summary.md
      - name: Publish discovery summary
        run: cat .local/cross-project-discovery/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-project-discovery
          path: |
            .local/cross-project-discovery/latest.json
            .local/cross-project-discovery/summary.md
          if-no-files-found: error
          retention-days: 30
