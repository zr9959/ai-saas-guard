name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish, usually a version tag.
        required: true
        default: v0.5.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'zr9959/ai-saas-guard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISH_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.PUBLISH_REF }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Verify package version matches publish ref
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync } from "node:fs";

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const refVersion = process.env.PUBLISH_REF.replace(/^refs\/tags\//, "").replace(/^v/, "");

          if (packageJson.version !== refVersion) {
            console.error(`package.json version ${packageJson.version} does not match ${process.env.PUBLISH_REF}`);
            process.exit(1);
          }
          EOF
      - run: npm publish --access public
