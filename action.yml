name: AI SaaS Guard
description: Run repo-local launch-readiness checks for AI-built SaaS apps.
author: ai-saas-guard

inputs:
  command:
    description: "Command to run: scan, check-supabase, check-stripe, check-mcp, check-actions, or pr-risk."
    required: false
    default: scan
  root:
    description: "Repository path to scan. Usually github.workspace."
    required: false
    default: ${{ github.workspace }}
  format:
    description: "Output format: terminal, json, sarif, markdown, or summary. Use summary for first-run CLI output, markdown for PR summaries, and sarif for code scanning."
    required: false
    default: terminal
  fail-on:
    description: "Fail the workflow when findings meet this severity: critical, high, medium, low, info, or none."
    required: false
    default: none
  base:
    description: "Base ref for pr-risk. Use origin/main with actions/checkout fetch-depth: 0."
    required: false
    default: ""
  config:
    description: "Optional ai-saas-guard JSON config path, relative to the workflow workspace or root."
    required: false
    default: ""
  output:
    description: "Optional path to write output while also keeping the command exit code."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install ai-saas-guard action dependencies
      shell: bash
      run: npm ci
      working-directory: ${{ github.action_path }}

    - name: Build ai-saas-guard
      shell: bash
      run: npm run build
      working-directory: ${{ github.action_path }}

    - name: Run ai-saas-guard
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail

        case "${INPUT_COMMAND}" in
          scan|check-supabase|check-stripe|check-mcp|check-actions|pr-risk) ;;
          *)
            echo "Invalid command input: ${INPUT_COMMAND}" >&2
            exit 2
            ;;
        esac

        case "${INPUT_FORMAT}" in
          terminal|json|sarif|markdown|summary) ;;
          *)
            echo "Invalid format input: ${INPUT_FORMAT}" >&2
            exit 2
            ;;
        esac

        case "${INPUT_FAIL_ON}" in
          none|critical|high|medium|low|info) ;;
          *)
            echo "Invalid fail-on input: ${INPUT_FAIL_ON}" >&2
            exit 2
            ;;
        esac

        if [ ! -d "${INPUT_ROOT}" ]; then
          echo "Root path does not exist or is not a directory: ${INPUT_ROOT}" >&2
          exit 2
        fi

        if [ -n "${INPUT_CONFIG}" ] && [ ! -f "${INPUT_CONFIG}" ] && [ ! -f "${INPUT_ROOT%/}/${INPUT_CONFIG}" ]; then
          echo "Config file not found: ${INPUT_CONFIG}" >&2
          exit 2
        fi

        args=("${INPUT_COMMAND}" "--root" "${INPUT_ROOT}")

        if [ "${INPUT_FORMAT}" = "json" ]; then
          args+=("--json")
        elif [ "${INPUT_FORMAT}" = "sarif" ]; then
          args+=("--sarif")
        elif [ "${INPUT_FORMAT}" = "markdown" ]; then
          args+=("--markdown")
        elif [ "${INPUT_FORMAT}" = "summary" ]; then
          args+=("--summary")
        fi

        if [ "${INPUT_FAIL_ON}" != "none" ]; then
          args+=("--fail-on" "${INPUT_FAIL_ON}")
        fi

        if [ -n "${INPUT_BASE}" ]; then
          args+=("--base" "${INPUT_BASE}")
        fi

        if [ -n "${INPUT_CONFIG}" ]; then
          args+=("--config" "${INPUT_CONFIG}")
        fi

        if [ -n "${INPUT_OUTPUT}" ]; then
          mkdir -p -- "$(dirname -- "${INPUT_OUTPUT}")"
          node "${GITHUB_ACTION_PATH}/dist/cli.js" "${args[@]}" | tee -- "${INPUT_OUTPUT}"
        else
          node "${GITHUB_ACTION_PATH}/dist/cli.js" "${args[@]}"
        fi
